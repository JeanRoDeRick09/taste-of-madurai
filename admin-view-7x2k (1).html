<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taste of Madurai — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#6B1E23; --mustard:#E3A234; --green:#5B7B4A;
    --bg:#FBF8F2; --paper:#FFFFFF; --line:#E7DAC2;
    --text:#2A1F17; --text-soft:#6E6255; --danger:#B23A32;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Work Sans',sans-serif;}
  .wrap{max-width:760px; margin:0 auto; padding:24px 18px 60px;}
  h1{font-family:'Fraunces',serif; font-size:26px; margin:0 0 4px;}
  .sub{color:var(--text-soft); font-size:13.5px; margin-bottom:22px;}

  .gate{max-width:340px; margin:80px auto; text-align:center;}
  .gate input{width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line); font-size:15px; margin:14px 0;}
  .gate button{width:100%; padding:13px; border-radius:10px; border:none; background:var(--maroon); color:#fff; font-weight:600; font-size:15px; cursor:pointer;}
  .gate .err{color:var(--danger); font-size:13px; display:none;}

  .stats-row{display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
  .stat{flex:1; min-width:120px; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px;}
  .stat .n{font-family:'Fraunces',serif; font-size:22px; color:var(--maroon); font-weight:700;}
  .stat .l{font-size:12px; color:var(--text-soft); margin-top:2px;}

  .filter-row{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .filter-btn{padding:7px 14px; border-radius:20px; border:1.5px solid var(--line); background:var(--paper); font-size:13px; cursor:pointer; color:var(--text-soft); font-weight:600;}
  .filter-btn.active{background:var(--maroon); color:#fff; border-color:var(--maroon);}

  .card{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; display:flex; gap:14px;}
  .card img{width:84px; height:84px; object-fit:cover; border-radius:10px; border:1px solid var(--line); cursor:pointer; flex-shrink:0;}
  .card-body{flex:1; min-width:0;}
  .row1{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .row1 .bid{font-family:'Fraunces',serif; font-weight:700; color:var(--maroon); font-size:15px;}
  .row1 .amt{font-weight:700; font-size:15px;}
  .meta{font-size:13px; color:var(--text-soft); margin-top:4px; line-height:1.5;}
  .badge{display:inline-block; font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px; margin-top:8px;}
  .badge.pending{background:#FBE7C6; color:#8A5A0A;}
  .badge.paid{background:#DFEBD6; color:var(--green);}
  .mark-btn{margin-top:8px; font-size:12.5px; padding:6px 12px; border-radius:8px; border:1px solid var(--green); background:transparent; color:var(--green); font-weight:600; cursor:pointer;}
  .mark-btn:disabled{opacity:.5; cursor:default;}

  .empty{text-align:center; color:var(--text-soft); padding:60px 0; font-size:14px;}
  .refresh-btn{background:transparent; border:1.5px solid var(--line); color:var(--text-soft); padding:8px 14px; border-radius:10px; font-size:13px; cursor:pointer; font-weight:600;}
  .top-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}

  .lightbox{display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:50; align-items:center; justify-content:center; padding:20px;}
  .lightbox.active{display:flex;}
  .lightbox img{max-width:100%; max-height:90vh; border-radius:8px;}
</style>
</head>
<body>

<div class="wrap" id="gate-wrap">
  <div class="gate">
    <h1>Admin access</h1>
    <p class="sub">Enter the stall admin passcode</p>
    <input type="password" id="passcode" placeholder="Passcode">
    <button onclick="tryLogin()">Enter</button>
    <div class="err" id="gate-err">Incorrect passcode</div>
  </div>
</div>

<div class="wrap" id="dash-wrap" style="display:none;">
  <div class="top-row">
    <div>
      <h1>Bookings</h1>
      <div class="sub" id="last-updated">Loading…</div>
    </div>
    <button class="refresh-btn" onclick="loadBookings()">↻ Refresh</button>
  </div>

  <div class="stats-row" id="stats-row"></div>

  <div class="filter-row">
    <div class="filter-btn active" data-f="all" onclick="setFilter('all')">All</div>
    <div class="filter-btn" data-f="pending" onclick="setFilter('pending')">Pending review</div>
    <div class="filter-btn" data-f="paid" onclick="setFilter('paid')">Verified paid</div>
  </div>

  <div id="list"></div>
</div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
  <img id="lightbox-img" src="">
</div>

<script>
  // ====== CONFIG ======
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwUyhEiPZXwhHcrhUM3J5S848DBWoc8De2Rs70CKscGypuLFKh9b3mYyIU727ZvohH01Q/exec";
  const ADMIN_PASSCODE = "Thirupa@1470"; // change this before hosting the page
  // Must exactly match SHARED_TOKEN in Code.gs
  const SHARED_TOKEN = "tom-9f8a2-madurai";

  function esc(str){
    return String(str == null ? "" : str)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  let bookings = [];
  let filter = 'all';

  function tryLogin(){
    const val = document.getElementById('passcode').value;
    if(val === ADMIN_PASSCODE){
      document.getElementById('gate-wrap').style.display='none';
      document.getElementById('dash-wrap').style.display='block';
      loadBookings();
    } else {
      document.getElementById('gate-err').style.display='block';
    }
  }

  async function loadBookings(){
    document.getElementById('last-updated').textContent = 'Refreshing…';
    try{
      const res = await fetch(APPS_SCRIPT_URL + '?action=list&token=' + encodeURIComponent(SHARED_TOKEN));
      const data = await res.json();
      bookings = data.bookings || [];
    }catch(err){
      console.error(err);
      document.getElementById('last-updated').textContent = 'Could not reach the backend — check APPS_SCRIPT_URL in admin.html';
      return;
    }
    document.getElementById('last-updated').textContent = 'Last updated ' + new Date().toLocaleTimeString();
    render();
  }

  function setFilter(f){
    filter = f;
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active', b.dataset.f===f));
    render();
  }

  function render(){
    const totalAmt = bookings.reduce((s,b)=>s+Number(b.amount||0),0);
    const pendingCount = bookings.filter(b=>!b.paid).length;
    document.getElementById('stats-row').innerHTML = `
      <div class="stat"><div class="n">${bookings.length}</div><div class="l">Total bookings</div></div>
      <div class="stat"><div class="n">₹${totalAmt}</div><div class="l">Total value</div></div>
      <div class="stat"><div class="n">${pendingCount}</div><div class="l">Awaiting verification</div></div>
    `;

    let shown = bookings;
    if(filter==='pending') shown = bookings.filter(b=>!b.paid);
    if(filter==='paid') shown = bookings.filter(b=>b.paid);

    const list = document.getElementById('list');
    if(shown.length===0){
      list.innerHTML = '<div class="empty">No bookings in this view yet.</div>';
      return;
    }
    list.innerHTML = shown.slice().reverse().map(b => `
      <div class="card">
        ${b.screenshotUrl ? `<img src="${esc(b.screenshotUrl)}" onclick="openImg('${esc(b.screenshotUrl)}')">` : `<div style="width:84px;height:84px;border-radius:10px;background:#F3E7D3;display:flex;align-items:center;justify-content:center;font-size:11px;color:#8A7A5F;text-align:center;">No screenshot</div>`}
        <div class="card-body">
          <div class="row1"><span class="bid">${esc(b.bookingId)}</span><span class="amt">₹${esc(b.amount)}</span></div>
          <div class="meta">
            ${esc(b.name)} · ${esc(b.batch)}<br>
            ${b.mutton>0 ? esc(b.mutton)+' Mutton ' : ''}${b.chicken>0 ? esc(b.chicken)+' Chicken' : ''}<br>
            📞 ${esc(b.contact)}${b.email ? ' · '+esc(b.email) : ''}
          </div>
          <span class="badge ${b.paid?'paid':'pending'}">${b.paid ? '✓ Verified paid' : 'Pending review'}</span><br>
          ${!b.paid ? `<button class="mark-btn" onclick="markPaid('${esc(b.bookingId)}', this)">Mark as verified</button>` : ''}
        </div>
      </div>
    `).join('');
  }

  function openImg(url){
    document.getElementById('lightbox-img').src = url;
    document.getElementById('lightbox').classList.add('active');
  }

  async function markPaid(bookingId, btn){
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try{
      await fetch(APPS_SCRIPT_URL, {
        method:'POST',
        body: JSON.stringify({ token: SHARED_TOKEN, action:'markPaid', bookingId }),
        headers: {'Content-Type':'text/plain;charset=utf-8'}
      });
      const b = bookings.find(x=>x.bookingId===bookingId);
      if(b) b.paid = true;
      render();
    }catch(err){
      console.error(err);
      btn.disabled = false;
      btn.textContent = 'Mark as verified';
    }
  }
</script>
</body>
</html>
